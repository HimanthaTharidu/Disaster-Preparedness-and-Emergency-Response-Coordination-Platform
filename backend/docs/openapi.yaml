openapi: 3.1.0

info:
  title: Disaster Preparedness and Emergency Response Coordination API
  version: 1.0.0
  description: API for user authentication, disaster incidents, and emergency shelters.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
  - name: Authentication
  - name: Incidents
  - name: Shelters

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid request
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [error, issues]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: [string, "null"]
        role:
          type: string
          enum: [operator, admin, field]
      required: [id, name, email, role]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^[+]?[0-9\s().-]+$'
        password:
          type: string
          minLength: 8
      required: [name, email, password]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, refreshToken, user]

    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        hazard:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [new, verified, assigned, resolved]
        place:
          type: string
        lat:
          type: number
        lng:
          type: number
        reportedAt:
          type: string
          format: date-time
        description:
          type: string
        peopleAtRisk:
          type: integer
          minimum: 0
      required:
        - id
        - title
        - hazard
        - priority
        - status
        - place
        - lat
        - lng
        - reportedAt
        - description
        - peopleAtRisk

    Shelter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        place:
          type: string
        lat:
          type: number
        lng:
          type: number
        capacity:
          type: integer
        occupancy:
          type: integer
        status:
          type: string
      required:
        - id
        - name
        - place
        - lat
        - lng
        - capacity
        - occupancy
        - status

paths:
  /health:
    get:
      tags: [Health]
      summary: Check whether the API is running
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: integer

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a field user
      description: New registrations receive the field role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid registration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a new token pair
      description: Refresh tokens are single-use; a successful request invalidates the submitted token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access and refresh tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Refresh token is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Token revoked
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      description: Available to operator and admin users.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, verified, assigned, resolved]
        - name: priority
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
                required: [incidents]
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User role does not have access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get an incident by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incident details
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident:
                    $ref: '#/components/schemas/Incident'
                required: [incident]
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User role does not have access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shelters:
    get:
      tags: [Shelters]
      summary: List shelters
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shelter list
          content:
            application/json:
              schema:
                type: object
                properties:
                  shelters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shelter'
                required: [shelters]
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'